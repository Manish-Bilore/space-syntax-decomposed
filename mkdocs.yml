site_name: "Space Syntax, decomposed"
site_description: >-
  Which design choices make Space Syntax differ from street-network analysis? Copenhagen and
  Mumbai, with Space Syntax reimplemented and matched to depthmapX.
site_author: Manish Bilore
site_url: https://manish-bilore.github.io/space-syntax-decomposed/
repo_url: https://github.com/Manish-Bilore/space-syntax-decomposed
repo_name: Manish-Bilore/space-syntax-decomposed
edit_uri: edit/main/docs/
copyright: >-
  Text and figures CC BY 4.0 · code MIT · street data © OpenStreetMap contributors (ODbL)

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: red
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: red
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Report: report.md
  - Map atlas: atlas/index.md
  - Glossary: glossary.md
  - Nuance catalogue: nuances.md
  - Work packages:
      - Phase 0 overview: results/phase0/index.md
      - Phase 0 tables: results/results_phase0.md
      - Fidelity check (Barnsbury): results/fidelity_barnsbury.md
      - Phase 1 summary: results/phase1/index.md
      - WP1 tiles: results/phase1/wp1_tiles.md
      - WP2 cleaning: results/phase1/wp2_cleaning_sensitivity.md
      - WP2 tables: results/phase1/wp2_sensitivity_tables.md
      - WP2b stubs: results/phase1/wp2b_consolidation_stubs.md
      - WP3 nested extents: results/phase1/wp3_nested_extents.md
      - WP4 axial: results/phase1/wp4_axial.md
  - Reproduce:
      - Pipeline: reproduce.md
      - Building depthmapX: depthmapx_build.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  links:
    not_found: warn
    anchors: warn
